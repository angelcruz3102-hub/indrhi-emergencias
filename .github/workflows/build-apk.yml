name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caché)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-read-only: false

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Decode google-services.json (si el secret existe)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > app/google-services.json
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK: $APK_PATH"
          ls -la "$APK_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: INDRHI-Emergencias-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "INDRHI Emergencias · build ${{ github.run_number }}"
          body: |
            APK generada automáticamente desde `${{ github.sha }}`.

            **Descarga directa:** toca el archivo `.apk` abajo.
            Instala en el teléfono habilitando "Instalar apps de origen desconocido" para tu navegador o gestor de archivos.
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
