name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync app -> android/app & ensure siren/resources
        run: |
          if [ -d app/src ]; then
            mkdir -p android/app/src
            cp -rf app/src/* android/app/src/
          fi

          RES_DIR="android/app/src/main/res"
          mkdir -p "$RES_DIR/xml" "$RES_DIR/drawable" "$RES_DIR/mipmap-anydpi-v26" "$RES_DIR/values" "$RES_DIR/raw"

          # Generar sirena bitonal aguda si no existe
          if [ ! -f "$RES_DIR/raw/sirena_emergencia.wav" ]; then
            python3 -c '
import wave, struct, math
rate = 22050
with wave.open("android/app/src/main/res/raw/sirena_emergencia.wav", "w") as f:
    f.setnchannels(1)
    f.setsampwidth(2)
    f.setframerate(rate)
    for i in range(rate * 4):
        freq = 1320.0 if (i // (rate // 4)) % 2 == 0 else 880.0
        val = int(32767.0 * math.sin(2.0 * math.pi * freq * i / rate))
        f.writeframes(struct.pack("<h", val))
'
          fi

          if [ ! -f "$RES_DIR/xml/network_security_config.xml" ]; then
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><network-security-config><base-config cleartextTrafficPermitted="false"><trust-anchors><certificates src="system" /></trust-anchors></base-config></network-security-config>' > "$RES_DIR/xml/network_security_config.xml"
          fi

          if ! grep -q "ic_launcher_background" "$RES_DIR/values/"*.xml 2>/dev/null; then
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FF0D47A1</color></resources>' > "$RES_DIR/values/ci_fallback_colors.xml"
          fi

          if ! grep -q "Theme.Indrhi.FullScreenAlert" "$RES_DIR/values/"*.xml 2>/dev/null; then
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.Indrhi" parent="android:Theme.Material.Light.NoActionBar" /><style name="Theme.Indrhi.FullScreenAlert" parent="android:Theme.Material.NoActionBar.Fullscreen" /></resources>' > "$RES_DIR/values/ci_fallback_themes.xml"
          fi

          # Normalizar paquete do.indrhi.emergencias -> com.indrhi.emergencias
          if [ -d android/app/src/main/java/do/indrhi/emergencias ]; then
            mkdir -p android/app/src/main/java/com/indrhi
            cp -rf android/app/src/main/java/do/indrhi/emergencias/* android/app/src/main/java/com/indrhi/emergencias/ 2>/dev/null || cp -rf android/app/src/main/java/do/indrhi/emergencias android/app/src/main/java/com/indrhi/emergencias
            rm -rf android/app/src/main/java/do
            find android/app/src -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" \) -exec sed -i 's/do\.indrhi\.emergencias/com.indrhi.emergencias/g' {} +
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Gradle wrapper
        working-directory: android
        run: |
          rm -f local.properties
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin --stacktrace
          fi
          chmod +x ./gradlew

      - name: Configure google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            printf '%s\n' '{"project_info":{"project_number":"123456789012","project_id":"indrhi-emergencias-dev","storage_bucket":"indrhi-emergencias-dev.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1111111111111111111111","android_client_info":{"package_name":"com.indrhi.emergencias"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForCiBuildOnly00000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:2222222222222222222222","android_client_info":{"package_name":"com.indrhi.emergencias.debug"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForCiBuildOnly00000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK: $APK_PATH"
          ls -la "$APK_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: INDRHI-Emergencias-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "INDRHI Emergencias · build ${{ github.run_number }}"
          body: |
            APK generada automáticamente desde `${{ github.sha }}`.

            **Descarga directa:** toca el archivo `.apk` abajo.
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
