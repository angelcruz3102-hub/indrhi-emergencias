name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: indrhi_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indrhi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify PostgreSQL accepts "postgres"
        env:
          PGPASSWORD: test
        run: |
          set -e
          for i in $(seq 1 30); do
            if psql -h 127.0.0.1 -U postgres -d indrhi_test \
                 -c "SELECT current_user, current_database();"; then
              echo "✅ PostgreSQL listo y autenticando como postgres"
              exit 0
            fi
            echo "Intento $i/30..."
            sleep 2
          done
          echo "❌ PostgreSQL no aceptó la conexión como postgres"
          docker ps -a
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: backend
        run: npm install

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/indrhi_test
          SCHEMA_PATH: ./db/schema.sql
          PGUSER: postgres
          PGPASSWORD: test
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: indrhi_test
        run: npm test
