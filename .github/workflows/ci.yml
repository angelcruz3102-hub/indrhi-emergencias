name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: indrhi_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indrhi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - name: Verify PostgreSQL accepts "postgres"
        env:
          PGPASSWORD: test
        run: |
          set -e
          for i in $(seq 1 30); do
            if psql -h localhost -U postgres -d indrhi_test \
                 -c "SELECT current_user, current_database();" 2>/dev/null; then
              echo "✅ PostgreSQL listo y autenticando como postgres"
              exit 0
            fi
            echo "Intento $i/30..."
            sleep 2
          done
          echo "❌ PostgreSQL no aceptó la conexión como postgres"
          docker ps -a
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/indrhi_test
          SCHEMA_PATH: ./db/schema.sql
          PGUSER: postgres
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: indrhi_test
        run: npm test

      - name: Diagnostic on failure
        if: failure()
        run: |
          echo "=== PG* env vars ==="
          env | grep -E "^PG" || true
          echo "=== TEST_DATABASE_URL ==="
          echo "${TEST_DATABASE_URL:-<unset>}"
          echo "=== Containers ==="
          docker ps -a
          echo "=== Postgres logs ==="
          docker logs $(docker ps -aqf "ancestor=postgres:16-alpine" | head -1) 2>&1 | tail -100 || true
