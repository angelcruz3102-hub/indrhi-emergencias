name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          set -e
          docker run -d --name pg \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=indrhi_test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            postgres:16-alpine

          for i in $(seq 1 60); do
            if docker exec pg pg_isready -U postgres -d indrhi_test; then
              echo "✅ PostgreSQL listo (intento $i)"
              PGPASSWORD=test psql -h localhost -U postgres -d indrhi_test -c "SELECT current_user;"
              exit 0
            fi
            sleep 2
          done
          echo "❌ No arrancó"
          docker logs pg
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - working-directory: backend
        run: npm ci

      - working-directory: backend
        run: npm run build

      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/indrhi_test
          SCHEMA_PATH: ./db/schema.sql
          PGUSER: postgres
          PGPASSWORD: test
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: indrhi_test
        run: npm test

      - name: Dump logs on failure
        if: failure()
        run: docker logs pg || true
